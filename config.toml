enable-module-update = true
parallel-jobs = 1
cli-source = "MorpheApp/morphe-desktop"
cli-version = "latest"

[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
patches-version = "latest"
rv-brand = "Morphe"
build-mode = "module"
#apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
#uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
excluded-patches = "'Alternative thumbnails' 'Bypass image region restrictions' 'Change form factor' 'Custom branding' 'Swipe controls' 'Wide search bar' 'Enable debugging'"
enable-update-checks = true

[Music-Morphe]
app-name = "Music"
patches-source = "MorpheApp/morphe-patches"
patches-version = "latest"
rv-brand = "Morphe"
build-mode = "module"
arch = "arm64-v8a"
#apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
#uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
excluded-patches = "'Enable debugging' 'Custom branding'"
enable-update-checks = true



[YouTube-Extended]
app-name = "YouTube"
rv-brand = "ReVanced Extended"
build-mode = "module"
patches-source = "anddea/revanced-patches"
patches-version = "dev"
archive-dlurl = "https://archive.org/download/crimsonman/apks/com.google.android.youtube"
# uptodown-dlurl = "https://youtube.en.uptodown.com/android"
# apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
excluded-patches = "'Alternative thumbnails' 'Bypass image region restrictions' 'Change form factor' 'Custom branding for YouTube' 'Swipe controls' 'Wide search bar' 'Enable debug logging'"
enable-update-checks = true

[YouTube-Music-Extended]
app-name = "YouTube Music"
rv-brand = "ReVanced Extended"
build-mode = "module"
arch = "arm64-v8a"
patches-source = "anddea/revanced-patches"
patches-version = "dev"
archive-dlurl = "https://archive.org/download/crimsonman/apks/com.google.android.apps.youtube.music"
# uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
# apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
included-patches = "'Disable music video in album'"
excluded-patches = "'Bypass image region restrictions' 'Custom branding for YouTube Music'  'Enable debug logging'"
enable-update-checks = true
